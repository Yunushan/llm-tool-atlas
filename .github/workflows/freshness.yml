name: freshness

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: freshness-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  records:
    name: freshness-90-days
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Verify repository and 90-day freshness policy
        run: python scripts/verify.py --max-age-days 90

  official-links:
    name: official-link-audit
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"

      - name: Audit official-source links
        id: audit
        continue-on-error: true
        run: >-
          python scripts/audit_links.py
          --timeout 15
          --workers 12
          --retries 2
          --json-output link-audit.json

      - name: Retain official-link audit report
        if: ${{ always() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: official-link-audit-${{ github.run_id }}
          path: link-audit.json
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce official-link audit result
        if: ${{ always() }}
        shell: bash
        env:
          AUDIT_OUTCOME: ${{ steps.audit.outcome }}
        run: |
          if [[ "$AUDIT_OUTCOME" != "success" ]]; then
            echo "Official-link audit result: $AUDIT_OUTCOME" >&2
            exit 1
          fi
