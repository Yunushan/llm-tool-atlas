name: release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  release:
    name: release
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Verify tag and repository
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/verify.py --tag "$RELEASE_TAG"

      - name: Require tagged commit to be on main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          git fetch --no-tags origin main
          git rev-parse --verify "$RELEASE_TAG^{commit}"
          git merge-base --is-ancestor "$RELEASE_TAG^{commit}" origin/main

      - name: Build deterministic release artifacts
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: >-
          python scripts/build_release.py
          --tag "$RELEASE_TAG"
          --output-dir dist

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: "dist/*"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          gh release create "$RELEASE_TAG" dist/* \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "LLM Tool Atlas $RELEASE_TAG"
          gh release edit "$RELEASE_TAG" --draft=false
