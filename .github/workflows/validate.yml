name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PYTHONUTF8: "1"

jobs:
  verify:
    name: verify (${{ matrix.label }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Ubuntu / Python 3.10
            os: ubuntu-24.04
            python: "3.10"
          - label: Ubuntu / Python 3.14
            os: ubuntu-24.04
            python: "3.14"
          - label: Windows / Python 3.14
            os: windows-2025
            python: "3.14"
          - label: macOS / Python 3.14
            os: macos-15
            python: "3.14"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Run complete verification
        run: python scripts/verify.py

  catalog:
    name: catalog
    if: ${{ always() }}
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require every verification job to pass
        shell: bash
        env:
          MATRIX_RESULT: ${{ needs.verify.result }}
        run: |
          if [[ "$MATRIX_RESULT" != "success" ]]; then
            echo "Verification matrix result: $MATRIX_RESULT" >&2
            exit 1
          fi
